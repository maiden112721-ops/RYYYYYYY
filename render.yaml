services:
  - type: web
    name: iloveyoury-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LETTER_PIN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CURRENCY
        value: PHP
      - key: TIMEZONE
        value: Asia/Manila
